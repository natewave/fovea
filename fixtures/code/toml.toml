# Cargo manifest for a small contrast checker.
[package]
name = "fovea-check"
version = "0.3.1"
edition = "2021"
authors = ["Fovea contributors"]
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
palette = "0.7"

[profile.release]
lto = true
opt-level = 3

[[bin]]
name = "fovea-check"
path = "src/main.rs"

[package.metadata.contrast]
body = 90
comment = 60.0
variants = ["day", "dusk", "night"]
checked = 2026-10-14T09:30:00Z
